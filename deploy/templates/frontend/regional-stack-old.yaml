AWSTemplateFormatVersion: '2010-09-09'
Description: Frontend Regional Resources Stack - CloudFront Distribution

Parameters:
  GlobalStackName:
    Type: String
    Description: Name of the global stack (for reference)
  S3BucketDomainName:
    Type: String
    Description: |
      S3 bucket regional domain name (e.g., bucket.s3.region.amazonaws.com).
      IMPORTANT: Use RegionalDomainName, NOT DomainName, to ensure CloudFront 
      connects to the correct region. Using the global endpoint (bucket.s3.amazonaws.com)
      will cause 403 errors when the bucket is not in us-east-1.
  CloudFrontOAI:
    Type: String
  CertificateArn:
    Type: String
  WAFWebACLArn:
    Type: String
  FrontendDomainName:
    Type: String
  HostedZoneId:
    Type: String
  CapabilityName:
    Type: String
  Environment:
    Type: String
  CloudFrontPriceClass:
    Type: String
    Default: PriceClass_100
  DefaultRootObject:
    Type: String
    Default: index.html
  ErrorPagePath:
    Type: String
    Default: /index.html
  DefaultCacheTTL:
    Type: Number
    Default: 86400
  MaxCacheTTL:
    Type: Number
    Default: 31536000
  EnableIPV6:
    Type: String
    Default: 'true'

Conditions:
  EnableIPV6Support: !Equals [!Ref EnableIPV6, 'true']

Resources:
  OriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub '${CapabilityName}-${Environment}-origin-request'
        Comment: Origin request policy for S3
        QueryStringsConfig:
          QueryStringBehavior: none
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers:
            - CloudFront-Viewer-Country
            - CloudFront-Is-Mobile-Viewer
            - CloudFront-Is-Desktop-Viewer
        CookiesConfig:
          CookieBehavior: none

  ResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${CapabilityName}-${Environment}-response-headers'
        Comment: !Sub 'Security headers for ${CapabilityName} ${Environment}'
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          XSSProtection:
            ModeBlock: true
            Protection: true
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: X-Environment
              Value: !Ref Environment
              Override: false
            - Header: X-Capability
              Value: !Ref CapabilityName
              Override: false

  StaticCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${CapabilityName}-${Environment}-static-cache'
        Comment: Cache policy for static assets
        DefaultTTL: !Ref DefaultCacheTTL
        MaxTTL: !Ref MaxCacheTTL
        MinTTL: 1
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          QueryStringsConfig:
            QueryStringBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          CookiesConfig:
            CookieBehavior: none

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        PriceClass: !Ref CloudFrontPriceClass
        DefaultRootObject: !Ref DefaultRootObject
        Origins:
          - Id: S3Origin
            DomainName: !Ref S3BucketDomainName
            S3OriginConfig:
              OriginAccessIdentity: !Sub 'origin-access-identity/cloudfront/${CloudFrontOAI}'
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: !Ref StaticCachePolicy
          OriginRequestPolicyId: !Ref OriginRequestPolicy
          ResponseHeadersPolicyId: !Ref ResponseHeadersPolicy
          Compress: true
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: !Ref ErrorPagePath
            ErrorCachingMinTTL: 0
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: !Ref ErrorPagePath
            ErrorCachingMinTTL: 0
        Aliases:
          - !Ref FrontendDomainName
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        WebACLId: !Ref WAFWebACLArn

  Route53Record:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref FrontendDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  Route53RecordIPV6:
    Type: AWS::Route53::RecordSet
    Condition: EnableIPV6Support
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref FrontendDomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

Outputs:
  DistributionId:
    Value: !Ref CloudFrontDistribution
    Export:
      Name: !Sub '${AWS::StackName}-DistributionId'
  CloudFrontDomainName:
    Value: !GetAtt CloudFrontDistribution.DomainName
  FrontendURL:
    Value: !Sub 'https://${FrontendDomainName}'

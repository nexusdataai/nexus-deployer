---
# Nexus Operator Deployment
# Feature: pure-eks-deployment
# Requirements: 3.2, 3.3
apiVersion: v1
kind: Namespace
metadata:
  name: nexus-system
  labels:
    app.kubernetes.io/name: nexus-system
    app.kubernetes.io/managed-by: nexus-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-operator
  namespace: nexus-system
  labels:
    app.kubernetes.io/name: nexus-operator
    app.kubernetes.io/component: operator
    app.kubernetes.io/managed-by: nexus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nexus-operator
  strategy:
    type: Recreate  # Only one operator instance should run
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexus-operator
        app.kubernetes.io/component: operator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: nexus-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: operator
          image: nexus/nexus-operator:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: AWS_REGION
              value: "us-east-1"  # Override via ConfigMap or env
            - name: AWS_CA_BUNDLE
              value: "/etc/ssl/certs/ca-certificates.crt"
            - name: EKS_CLUSTER_NAME
              value: ""  # REQUIRED: Set to your EKS cluster name for IRSA
            - name: LOG_LEVEL
              value: "INFO"
            # Fallback awsAccessMode used when NexusNetworkConfig is not yet
            # applied to the cluster. Must be one of:
            #   higher-cost (default) | moderate | lowest-cost | public-nodes
            - name: AWS_ACCESS_MODE_DEFAULT
              value: "higher-cost"
            # Set to "true" only on legacy clusters where the operator owns
            # VPC endpoint provisioning (pre-deploy/eks --network-profile).
            - name: OPERATOR_PROVISION_LEGACY
              value: "false"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-operator
  namespace: nexus-system
  labels:
    app.kubernetes.io/name: nexus-operator
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app.kubernetes.io/name: nexus-operator

---
# Totogi Operator RBAC Configuration
# Feature: pure-eks-deployment
# Requirements: 3.4
#
# IRSA — do NOT `kubectl apply -f` this file without substituting ${ACCOUNT_ID}; that overwrites
# eks.amazonaws.com/role-arn with a literal template and breaks the operator. Use:
#   export ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
#   sed -e "s|\${ACCOUNT_ID}|${ACCOUNT_ID}|g" manifests/rbac.yaml | kubectl apply -f -
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nexus-operator
  namespace: nexus-system
  annotations:
    # IRSA: do not apply as-is. Substitute ${ACCOUNT_ID} (see permissions/ADMIN-SETUP.md), e.g.:
    #   export ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
    #   sed -e "s|\${ACCOUNT_ID}|${ACCOUNT_ID}|g" manifests/rbac.yaml | kubectl apply -f -
    eks.amazonaws.com/role-arn: "arn:aws:iam::${ACCOUNT_ID}:role/TotogiOperatorRole"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nexus-operator
rules:
  # TotogiCapability CRD management
  - apiGroups: ["totogi.com"]
    resources: ["totogicapabilities"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["totogi.com"]
    resources: ["totogicapabilities/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["totogi.com"]
    resources: ["totogicapabilities/finalizers"]
    verbs: ["update"]

  # TotogiNetworkConfig CRD (VPC endpoints — kopf watches cluster-scoped resources)
  - apiGroups: ["totogi.com"]
    resources: ["totoginetworkconfigs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["totogi.com"]
    resources: ["totoginetworkconfigs/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["totogi.com"]
    resources: ["totoginetworkconfigs/finalizers"]
    verbs: ["update"]

  # Core Kubernetes resources
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/exec"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  
  # Deployments and StatefulSets
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments/status", "statefulsets/status"]
    verbs: ["get"]
  
  # Autoscaling
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  
  # Pod Disruption Budgets
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  
  # Ingress
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  
  # Coordination for leader election
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nexus-operator
subjects:
  - kind: ServiceAccount
    name: nexus-operator
    namespace: nexus-system
roleRef:
  kind: ClusterRole
  name: nexus-operator
  apiGroup: rbac.authorization.k8s.io

# Minimal nexus-sre on local-cluster (K3s) — Cloudflare tunnel exposes nexus-sre-ui:80
namespace: nexus-sre
env: local
version: "3.1.4-29fd9f9"

image:
  registry: docker.io/library
  pullPolicy: IfNotPresent
  backend:
    repository: nexus-sre-backend
    tag: "3.1.4-29fd9f9"
  ui:
    repository: nexus-sre-ui
    tag: "3.1.3-29fd9f9"
  postgres:
    repository: nexus-sre-postgres
    tag: "latest"

backend:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits:   { cpu: 1000m, memory: 1Gi }
  postgres:
    dsn: "postgresql+asyncpg://nexus:nexus@pgvector-svc.nexus-local.svc.cluster.local:5432/nexus_sre"
  env:
    NEXUS_ENV: dev
    NEXUS_LOG_LEVEL: INFO
    NEXUS_LOG_FORMAT: text
    NEXUS_K8S_IN_CLUSTER: "true"
    NEXUS_K8S_DEFAULT_NAMESPACE: nexus-sre
    NEXUS_TENANT_ID: 00000000-0000-0000-0000-000000000001
    NEXUS_JWT_SECRET: "nexus-sre-local-jwt-hs256-change-me-32b"
    NEXUS_API_KEY: "nexus-sre-api-key-grace"

ui:
  replicas: 1

ingress:
  enabled: false

nats:
  enabled: false

temporal:
  enabled: false

workers:
  enabled: false

opa:
  enabled: false

retentionCron:
  enabled: false

auditWormCron:
  enabled: false

postgresBackup:
  enabled: false

pdb:
  enabled: false

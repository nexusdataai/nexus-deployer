---
# NexusNetworkConfig Custom Resource Definition
# Manages VPC Gateway and Interface Endpoints for private EKS clusters.
# Applied once per cluster; the operator creates/verifies endpoints and
# reports status. All capabilities read from this status during deploy.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nexusnetworkconfigs.nexus.ai
  annotations:
    description: "Manages VPC endpoints (Gateway + PrivateLink) for AWS service access from private EKS clusters"
spec:
  group: nexus.ai
  names:
    kind: NexusNetworkConfig
    listKind: NexusNetworkConfigList
    plural: nexusnetworkconfigs
    singular: nexusnetworkconfig
    shortNames:
      - tnc
  scope: Cluster
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - clusterName
              properties:
                clusterName:
                  type: string
                  description: "EKS cluster name used to discover VPC, subnets, and route tables"
                region:
                  type: string
                  description: "AWS region"
                  default: us-east-1
                awsAccessMode:
                  type: string
                  enum:
                    - higher-cost
                    - moderate
                    - lowest-cost
                    - public-nodes
                  default: higher-cost
                  description: |
                    AWS service access topology declared by the cluster provisioning
                    script (deploy/eks/create-hardened-eks-cluster.sh --network-profile).
                    The operator validates the cluster matches this declaration and
                    projects the matching env vars into backend pods. It does NOT
                    create or modify VPC resources; topology lifecycle belongs to the
                    provisioning script.
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: "Pending, Provisioning, Ready, Error"
                activeMode:
                  type: string
                  description: "The awsAccessMode last validated by the operator"
                validation:
                  type: object
                  description: "Result of validating the cluster topology against awsAccessMode"
                  properties:
                    ok:
                      type: boolean
                    expected:
                      type: string
                    actual:
                      type: string
                    missing:
                      type: array
                      items:
                        type: string
                endpoints:
                  type: array
                  items:
                    type: object
                    properties:
                      service:
                        type: string
                      endpointId:
                        type: string
                      type:
                        type: string
                      state:
                        type: string
                totalEndpoints:
                  type: integer
                healthyEndpoints:
                  type: integer
                lastChecked:
                  type: string
                message:
                  type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Mode
          type: string
          jsonPath: .status.activeMode
        - name: Endpoints
          type: integer
          jsonPath: .status.totalEndpoints
        - name: Healthy
          type: integer
          jsonPath: .status.healthyEndpoints
        - name: Last Checked
          type: string
          jsonPath: .status.lastChecked
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp

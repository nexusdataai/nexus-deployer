# Nexus Simulator — local K3s in-cluster (API + UI pods, shared nexus-local AWS stack)
#
# Prerequisites:
#   ./local-k3s/create-local-k3s-cluster.sh
#   ./kube-operator/operator.sh deploy
#   ../local-k3s/deploy-local-aws-stack.sh --kube-context local-cluster
#
# Deploy:
#   ./deploy-app-changes.sh simulator --env local --all

apiVersion: v1
kind: Namespace
metadata:
  name: simulator-local
  labels:
    app.kubernetes.io/name: nexus-simulator
    nexus.ai/capability: simulator
    nexus.ai/environment: local
---
apiVersion: nexus.ai/v1
kind: NexusCapability
metadata:
  name: simulator-local
  namespace: simulator-local
  labels:
    app.kubernetes.io/name: nexus-simulator
    nexus.ai/capability: simulator
    nexus.ai/environment: local
spec:
  capabilityName: simulator
  version: "0.1.0"
  environment: local
  region: us-east-1
  enableCognito: false
  deletionPolicy: Retain

  localEmulation:
    enabled: true
    namespace: nexus-local
    skipCognito: true
    skipIam: true
    skipSsmSecrets: true

  dataServices:
    dynamodb:
      enabled: false
    s3:
      enabled: false
    glue:
      enabled: false

  backend:
    enabled: true
    replicas: 1
    image: "__API_IMAGE__"

  frontend:
    enabled: true
    replicas: 1
    image: "__UI_IMAGE__"

  bssmagic:
    enabled: false

  postgres:
    enabled: false

  mimir:
    enabled: false

  redis:
    enabled: false

  ingress:
    enabled: false

  internalIngress:
    enabled: false

  hpa:
    enabled: false

  pdb:
    enabled: false

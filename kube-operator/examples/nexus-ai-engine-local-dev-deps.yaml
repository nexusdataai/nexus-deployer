# Nexus AI Engine — K3s dev dependencies only (host-run backend/frontend)
#
# Shared AWS emulation (Scylla, MinIO, MiniStack) comes from local-k3s/deploy-local-aws-stack.sh
# in the nexus-local namespace. This CR registers the ai-engine-local namespace only.
#
# Prerequisites:
#   ./local-k3s/create-local-k3s-cluster.sh
#   ./kube-operator/operator.sh deploy
#   ../local-k3s/deploy-local-aws-stack.sh --kube-context local-cluster
#
# Deploy (optional):
#   source ../../aws-login/.active-env
#   kubectl --context local-cluster apply -f examples/nexus-ai-engine-local-dev-deps.yaml
#
# Then on the host:
#   cd ../../nexus-ai-engine && ./scripts/port-forward-k3s-dev.sh
#   make init-k3s-local-aws
#   cp backend/.env.local.k3s.example backend/.env.local
#   make dev-backend

apiVersion: v1
kind: Namespace
metadata:
  name: ai-engine-local
  labels:
    app.kubernetes.io/name: nexus-ai-engine
    nexus.ai/capability: ai-engine
    nexus.ai/environment: local
---
apiVersion: nexus.ai/v1
kind: NexusCapability
metadata:
  name: ai-engine-local-dev-deps
  namespace: ai-engine-local
  labels:
    app.kubernetes.io/name: nexus-ai-engine
    nexus.ai/capability: ai-engine
    nexus.ai/environment: local
spec:
  capabilityName: ai-engine
  version: "0.1.0"
  environment: local
  region: us-east-1
  enableCognito: false
  deletionPolicy: Retain

  localEmulation:
    enabled: true
    namespace: nexus-local
    skipCognito: true
    skipIam: true
    skipSsmSecrets: true

  dataServices:
    dynamodb:
      enabled: false
    s3:
      enabled: false
    glue:
      enabled: false

  backend:
    enabled: false

  frontend:
    enabled: false

  bssmagic:
    enabled: false

  postgres:
    enabled: false

  mimir:
    enabled: false

  redis:
    enabled: false

  ingress:
    enabled: false

  internalIngress:
    enabled: false

  hpa:
    enabled: false

  pdb:
    enabled: false

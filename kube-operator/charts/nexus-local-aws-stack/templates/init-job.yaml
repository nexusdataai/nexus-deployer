apiVersion: batch/v1
kind: Job
metadata:
  name: nexus-local-init
  namespace: {{ .Values.global.namespace }}
  labels:
    app: nexus-local-init
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: nexus-local-init
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              for host in minio-svc:9000 scylla-svc:8000 ministack-svc:4566; do
                h=${host%%:*}; p=${host##*:}
                echo "waiting for $h:$p"
                until nc -z "$h" "$p"; do sleep 3; done
              done
      containers:
        - name: init
          image: {{ .Values.init.image }}
          command:
            - sh
            - -c
            - |
              pip install --no-cache-dir boto3 >/dev/null
              python /scripts/local_init_aws.py \
                --capabilities "{{ join "," .Values.init.capabilities }}" \
                --environment "{{ .Values.init.environment }}" \
                --region "{{ .Values.global.awsRegion }}" \
                --account-id "{{ .Values.global.localAccountId }}" \
                --minio-endpoint "http://minio-svc.{{ .Values.global.namespace }}.svc.cluster.local:9000" \
                --scylla-endpoint "http://scylla-svc.{{ .Values.global.namespace }}.svc.cluster.local:8000" \
                --ministack-endpoint "http://ministack-svc.{{ .Values.global.namespace }}.svc.cluster.local:4566"
          env:
            - name: AWS_ACCESS_KEY_ID
              value: {{ .Values.minio.accessKey | quote }}
            - name: AWS_SECRET_ACCESS_KEY
              value: {{ .Values.minio.secretKey | quote }}
            {{- if .Values.mimir.enabled }}
            - name: SHARED_MIMIR_BUCKET
              value: {{ .Values.mimir.blocksBucket | quote }}
            {{- end }}
          volumeMounts:
            - name: init-script
              mountPath: /scripts
      volumes:
        - name: init-script
          configMap:
            name: nexus-local-init-script
            defaultMode: 0555

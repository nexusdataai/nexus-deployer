---
# TotogiNetworkConfig Custom Resource Definition
# Manages VPC Gateway and Interface Endpoints for private EKS clusters.
# Applied once per cluster; the operator creates/verifies endpoints and
# reports status. All capabilities read from this status during deploy.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: totoginetworkconfigs.totogi.com
  annotations:
    description: "Manages VPC endpoints (Gateway + PrivateLink) for AWS service access from private EKS clusters"
spec:
  group: totogi.com
  names:
    kind: TotogiNetworkConfig
    listKind: TotogiNetworkConfigList
    plural: totoginetworkconfigs
    singular: totoginetworkconfig
    shortNames:
      - tnc
  scope: Cluster
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - clusterName
              properties:
                clusterName:
                  type: string
                  description: "EKS cluster name used to discover VPC, subnets, and route tables"
                region:
                  type: string
                  description: "AWS region"
                  default: ap-southeast-1
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: "Pending, Provisioning, Ready, Error"
                endpoints:
                  type: array
                  items:
                    type: object
                    properties:
                      service:
                        type: string
                      endpointId:
                        type: string
                      type:
                        type: string
                      state:
                        type: string
                totalEndpoints:
                  type: integer
                healthyEndpoints:
                  type: integer
                lastChecked:
                  type: string
                message:
                  type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Endpoints
          type: integer
          jsonPath: .status.totalEndpoints
        - name: Healthy
          type: integer
          jsonPath: .status.healthyEndpoints
        - name: Last Checked
          type: string
          jsonPath: .status.lastChecked
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp

AWSTemplateFormatVersion: '2010-09-09'
Description: Frontend Regional Resources Stack - S3, CloudFront, and Route53 (can be deployed in any region)

Parameters:
  GlobalStackName:
    Type: String
    Description: Name of the global stack (for reference only, not used for imports)
  
  CapabilityName:
    Type: String
    Description: Name of the business capability
    MinLength: 1
    MaxLength: 50
    AllowedPattern: ^[a-z0-9][a-z0-9-]*$
  
  Environment:
    Type: String
    Description: Environment name
    AllowedValues:
      - dev
      - test
      - stage
      - prod
    Default: dev
  
  CloudFrontPriceClass:
    Type: String
    Default: PriceClass_100
  
  DefaultRootObject:
    Type: String
    Default: index.html
  
  ErrorPagePath:
    Type: String
    Default: /index.html
  
  DefaultCacheTTL:
    Type: Number
    Default: 86400
  
  MaxCacheTTL:
    Type: Number
    Default: 31536000
  
  EnableIPV6:
    Type: String
    Default: 'true'
  
  # Cross-region parameters (passed from global stack outputs)
  FrontendDomainName:
    Type: String
    Description: Frontend domain name from global stack
  
  CertificateArn:
    Type: String
    Description: ACM Certificate ARN from global stack (us-east-1)
  
  WAFWebACLArn:
    Type: String
    Description: WAF Web ACL ARN from global stack (us-east-1)
  
  HostedZoneId:
    Type: String
    Description: Route53 Hosted Zone ID from global stack

Conditions:
  EnableIPV6Support: !Equals [!Ref EnableIPV6, 'true']
  IsProd: !Equals [!Ref Environment, 'prod']

Resources:
  # S3 Bucket for Frontend Static Content (can be in any region)
  S3Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete  # Changed from Retain to Delete to avoid orphaned buckets
    UpdateReplacePolicy: Retain  # Keep data safe during stack updates
    Properties:
      BucketName: !Sub '${CapabilityName}-${Environment}-frontend'
      AccessControl: Private
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: !If [IsProd, 90, 30]
          - Id: TransitionOldVersions
            Status: Enabled
            NoncurrentVersionTransitions:
              - TransitionInDays: 30
                StorageClass: STANDARD_IA
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - GET
              - HEAD
            AllowedOrigins:
              - '*'
            MaxAge: 3600
      Tags:
        - Key: Name
          Value: !Sub '${CapabilityName}-${Environment}-frontend'
        - Key: Environment
          Value: !Ref Environment
        - Key: Capability
          Value: !Ref CapabilityName

  # CloudFront Origin Access Identity (global resource, but can be created in any region)
  CloudFrontOriginAccessIdentity:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: !Sub 'OAI for ${CapabilityName}-${Environment}'

  # S3 Bucket Policy for CloudFront Origin Access Identity
  S3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref S3Bucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontOAI
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::cloudfront:user/CloudFront Origin Access Identity ${CloudFrontOriginAccessIdentity}'
            Action:
              - s3:GetObject
            Resource: !Sub '${S3Bucket.Arn}/*'
          - Sid: AllowCloudFrontListBucket
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::cloudfront:user/CloudFront Origin Access Identity ${CloudFrontOriginAccessIdentity}'
            Action:
              - s3:ListBucket
            Resource: !GetAtt S3Bucket.Arn

  # CloudFront Policies
  OriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub '${CapabilityName}-${Environment}-origin-request'
        Comment: Origin request policy for S3
        QueryStringsConfig:
          QueryStringBehavior: none
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers:
            - CloudFront-Viewer-Country
            - CloudFront-Is-Mobile-Viewer
            - CloudFront-Is-Desktop-Viewer
        CookiesConfig:
          CookieBehavior: none

  ResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${CapabilityName}-${Environment}-response-headers'
        Comment: !Sub 'Security headers for ${CapabilityName} ${Environment}'
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          XSSProtection:
            ModeBlock: true
            Protection: true
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: X-Environment
              Value: !Ref Environment
              Override: false
            - Header: X-Capability
              Value: !Ref CapabilityName
              Override: false

  StaticCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${CapabilityName}-${Environment}-static-cache'
        Comment: Cache policy for static assets
        DefaultTTL: !Ref DefaultCacheTTL
        MaxTTL: !Ref MaxCacheTTL
        MinTTL: 1
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          QueryStringsConfig:
            QueryStringBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          CookiesConfig:
            CookieBehavior: none

  # CloudFront Distribution
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        PriceClass: !Ref CloudFrontPriceClass
        DefaultRootObject: !Ref DefaultRootObject
        Origins:
          - Id: S3Origin
            # Use regional S3 domain to ensure CloudFront connects to the correct region
            # S3Bucket.DomainName returns global endpoint (bucket.s3.amazonaws.com) which defaults to us-east-1
            # S3Bucket.RegionalDomainName returns regional endpoint (bucket.s3.region.amazonaws.com)
            DomainName: !GetAtt S3Bucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: !Sub 'origin-access-identity/cloudfront/${CloudFrontOriginAccessIdentity}'
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: !Ref StaticCachePolicy
          OriginRequestPolicyId: !Ref OriginRequestPolicy
          ResponseHeadersPolicyId: !Ref ResponseHeadersPolicy
          Compress: true
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: !Ref ErrorPagePath
            ErrorCachingMinTTL: 0
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: !Ref ErrorPagePath
            ErrorCachingMinTTL: 0
        Aliases:
          - !Ref FrontendDomainName
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        WebACLId: !Ref WAFWebACLArn

  # Route53 Records
  Route53Record:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref FrontendDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2  # CloudFront hosted zone ID (constant)
        EvaluateTargetHealth: false

  Route53RecordIPV6:
    Type: AWS::Route53::RecordSet
    Condition: EnableIPV6Support
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref FrontendDomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2  # CloudFront hosted zone ID (constant)
        EvaluateTargetHealth: false

Outputs:
  S3BucketName:
    Description: Name of the S3 bucket
    Value: !Ref S3Bucket
    Export:
      Name: !Sub '${AWS::StackName}-S3BucketName'
  
  S3BucketArn:
    Description: ARN of the S3 bucket
    Value: !GetAtt S3Bucket.Arn
    Export:
      Name: !Sub '${AWS::StackName}-S3BucketArn'
  
  S3BucketRegionalDomainName:
    Description: Regional domain name of the S3 bucket (used by CloudFront origin)
    Value: !GetAtt S3Bucket.RegionalDomainName
    Export:
      Name: !Sub '${AWS::StackName}-S3BucketRegionalDomainName'
  
  CloudFrontDistributionId:
    Description: CloudFront Distribution ID
    Value: !Ref CloudFrontDistribution
    Export:
      Name: !Sub '${AWS::StackName}-CloudFrontDistributionId'
  
  CloudFrontDomainName:
    Description: CloudFront Distribution Domain Name
    Value: !GetAtt CloudFrontDistribution.DomainName
    Export:
      Name: !Sub '${AWS::StackName}-CloudFrontDomainName'
  
  CloudFrontURL:
    Description: Frontend URL
    Value: !Sub 'https://${FrontendDomainName}'
    Export:
      Name: !Sub '${AWS::StackName}-CloudFrontURL'

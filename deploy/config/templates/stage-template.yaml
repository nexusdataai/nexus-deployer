infrastructure:
  domain:
    base: example.com
    frontend_subdomain: app-stage
    backend_subdomain: api-stage
    hosted_zone_id: ""
  
  frontend:
    cloudfront:
      enabled: true
      price_class: PriceClass_200
      waf_enabled: true
      cache_ttl: 43200
      enable_logging: true
      enable_ipv6: true
      rate_limit: 2000
  
  backend:
    vpc:
      create_new: true
      vpc_cidr: 10.0.0.0/16
      enable_nat_gateway: true
      enable_flow_logs: true  # Security: VPC traffic logging enabled for stage
    
    waf:
      enabled: true  # Security: WAF protection enabled for stage
      rate_limit: 3000
    
    ecs:
      cluster_name: null
      container_port: 8000
      task_cpu: 1024
      task_memory: 2048
      desired_count: 2
      health_check_path: /health
    
    autoscaling:
      enabled: true
      min_capacity: 1
      max_capacity: 3
      target_cpu: 70
      target_memory: 80
    
    storage:
      dynamodb_billing_mode: PAY_PER_REQUEST
      enable_backup: true
      enable_point_in_time_recovery: true
      ecr_image_scan_on_push: true
      ecr_image_retention_days: 14
    
    certificate:
      create_in_foundation: true
    
    alb:
      enable_access_logs: true
      deregistration_delay: 30
      health_check_interval: 30
      health_check_timeout: 10
      healthy_threshold: 2
      unhealthy_threshold: 3
  
  monitoring:
    cloudwatch:
      log_retention_days: 14
      container_insights: true
    cost_alerts:
      enabled: true  # Cost: Enable anomaly detection for stage
      threshold_usd: 50  # Alert when daily cost exceeds $50
      alert_email: ""  # Set your alert email
  
  # Pre-deployment validation settings
  pre_validation:
    # Enable/disable pre-deployment validation
    enabled: true
    # Strict mode: warnings block deployment (not just errors)
    strict_mode: true
    # Enforce export naming convention
    enforce_naming_convention: true
    # Validate stack dependencies before deployment
    validate_dependencies: true
  
  tags:
    common:
      Project: ""
      Environment: stage
      ManagedBy: CloudFormation
      Team: ""
      Application: ""
      CostCenter: ""

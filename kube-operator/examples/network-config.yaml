# NexusNetworkConfig -- VPC Endpoint Setup
#
# Apply once per cluster to create/verify VPC Gateway and Interface endpoints.
# The operator provisions missing endpoints and reports status.
#
# Usage:
#   kubectl apply -f manifests/network-config-crd.yaml   # CRD first
#   sed 's/__CLUSTER_NAME__/my-cluster/g; s/__REGION__/us-east-1/g' \
#       examples/network-config.yaml | kubectl apply -f -
#
#   kubectl get tnc vpc-endpoints                        # Check status
#
# Or use the CLI:
#   ./operator-nexus-test.sh setup-endpoints
#
apiVersion: nexus.ai/v1
kind: NexusNetworkConfig
metadata:
  name: vpc-endpoints
spec:
  clusterName: __CLUSTER_NAME__
  region: __REGION__
  # Must match deploy/eks/create-hardened-eks-cluster.sh --network-profile.
  # The operator validates the cluster topology against this value and projects
  # AWS_ACCESS_MODE / AWS_DISABLE_EXPLICIT_SERVICE_ENDPOINTS into backend pods.
  #
  #   higher-cost   ~$120-250/mo - full PrivateLink (default)
  #   moderate      ~$12-18/mo   - S3/DDB gateway + NAT instance per AZ
  #   lowest-cost   ~$3-5/mo     - S3/DDB gateway + single NAT instance
  #   public-nodes  ~$0/mo       - nodes carry public IPs (dev only)
  awsAccessMode: higher-cost

global:
  namespace: nexus-local
  storageClass: local-path
  awsRegion: us-east-1
  localAccountId: "000000000000"

minio:
  image: minio/minio:RELEASE.2024-12-18T13-15-44Z
  accessKey: minioadmin
  secretKey: minioadmin
  persistence:
    size: 200Gi

redis:
  image: redis:7-alpine
  persistence:
    size: 2Gi
  maxmemory: 2gb

ministack:
  image: ministackorg/ministack:latest
  persistence:
    size: 10Gi

scylla:
  image: scylladb/scylla:5.4
  persistence:
    size: 80Gi
  resources:
    limits:
      memory: 2Gi
    requests:
      memory: 1Gi

trino:
  image: trinodb/trino:451
  coordinator:
    resources:
      limits:
        memory: 4Gi
      requests:
        memory: 2Gi

# Shared Grafana Mimir (TSDB blocks in MinIO). Capabilities set mimir.enabled: false.
mimir:
  enabled: true
  image: grafana/mimir:2.13.0
  retentionDays: 30
  blocksBucket: shared-local-mimir-blocks-000000000000
  persistence:
    size: 5Gi

# Shared Postgres + pgvector + Apache AGE (nexus-sre-postgres is required for local K3s).
postgres:
  enabled: true
  image: nexus-sre-postgres:latest
  imagePullPolicy: IfNotPresent
  database: ontology_cp
  user: nexus
  password: nexus
  persistence:
    size: 5Gi
  initExtensions: true
  ageGraphName: enterprise_onto

init:
  image: python:3.12-slim
  capabilities:
    - ontology
    - nexus-ai
    - ai-engine
  environment: local

---
# Example NexusCapability for testing operator deployment
# This creates a minimal deployment for nexus-ai capability
#
# Apply with:
#   kubectl apply -f test-capability.yaml
#
# Check status:
#   kubectl get nexuscapabilities -A
#   kubectl describe nexuscapability test-capability

apiVersion: nexus.ai/v1
kind: NexusCapability
metadata:
  name: nexus-ai-dev
  namespace: nexus-ai-dev  # Dedicated namespace - operator will create it
  labels:
    app.kubernetes.io/name: nexus-ai
    app.kubernetes.io/version: "1.0.0"
    nexus.ai/environment: dev
spec:
  # Basic capability info
  capabilityName: nexus-ai
  version: "1.0.0"
  environment: dev
  region: us-east-1
  
  # Frontend deployment (optional)
  frontend:
    replicas: 1
    image: "nginx:latest"  # Replace with actual frontend image
  
  # Backend deployment (optional)
  backend:
    replicas: 1
    image: "nginx:latest"  # Replace with actual backend image
  
  # AWS data services to provision
  dataServices:
    dynamodb: {}
    s3: {}
    glue: {}
  
  # What to do with AWS resources when CR is deleted
  # Options: Delete (remove all resources) or Retain (keep AWS resources)
  deletionPolicy: Delete

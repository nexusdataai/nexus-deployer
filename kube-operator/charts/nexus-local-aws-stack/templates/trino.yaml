apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-catalog
  namespace: {{ .Values.global.namespace }}
data:
  hive.properties: |
    connector.name=hive
    hive.metastore=file
    hive.metastore.catalog.dir=file:///tmp/trino-metastore
    hive.s3.aws-access-key={{ .Values.minio.accessKey }}
    hive.s3.aws-secret-key={{ .Values.minio.secretKey }}
    hive.s3.endpoint=http://minio-svc.{{ .Values.global.namespace }}.svc.cluster.local:9000
    hive.s3.path-style-access=true
    hive.s3.ssl.enabled=false
    hive.non-managed-table-writes-enabled=true
  memory.properties: |
    connector.name=memory
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-config
  namespace: {{ .Values.global.namespace }}
data:
  config.properties: |
    coordinator=true
    node-scheduler.include-coordinator=true
    http-server.http.port=8080
    discovery.uri=http://localhost:8080
    query.max-memory=2GB
    query.max-memory-per-node=1GB
  node.properties: |
    node.environment=local
    node.data-dir=/data/trino
  jvm.config: |
    -server
    -Xmx2G
    -XX:+UseG1GC
    -XX:G1HeapRegionSize=32M
    -XX:+ExplicitGCInvokesConcurrent
    -XX:+HeapDumpOnOutOfMemoryError
    -XX:+ExitOnOutOfMemoryError
    -Djdk.attach.allowAttachSelf=true
    -XX:+UnlockDiagnosticVMOptions
    -XX:G1NumCollectionsKeepPinned=10000000
---
apiVersion: v1
kind: Service
metadata:
  name: trino-svc
  namespace: {{ .Values.global.namespace }}
  labels:
    app: trino
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: trino
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino
  namespace: {{ .Values.global.namespace }}
  labels:
    app: trino
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trino
  template:
    metadata:
      labels:
        app: trino
    spec:
      containers:
        - name: trino
          image: {{ .Values.trino.image }}
          ports:
            - containerPort: 8080
              name: http
          resources:
            {{- toYaml .Values.trino.coordinator.resources | nindent 12 }}
          volumeMounts:
            - name: trino-config
              mountPath: /etc/trino/config.properties
              subPath: config.properties
            - name: trino-config
              mountPath: /etc/trino/node.properties
              subPath: node.properties
            - name: trino-config
              mountPath: /etc/trino/jvm.config
              subPath: jvm.config
            - name: trino-catalog
              mountPath: /etc/trino/catalog
            - name: trino-data
              mountPath: /data/trino
          readinessProbe:
            httpGet:
              path: /v1/info
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: trino-config
          configMap:
            name: trino-config
        - name: trino-catalog
          configMap:
            name: trino-catalog
        - name: trino-data
          emptyDir: {}

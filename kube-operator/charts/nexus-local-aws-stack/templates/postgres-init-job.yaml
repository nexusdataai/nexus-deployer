{{- if and .Values.postgres.enabled .Values.postgres.initExtensions }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
  namespace: {{ .Values.global.namespace }}
  labels:
    app: postgres-init
data:
  init.sql: |
    CREATE EXTENSION IF NOT EXISTS vector;

    CREATE TABLE IF NOT EXISTS control_plane_embeddings (
        id SERIAL PRIMARY KEY,
        content_type VARCHAR(50) NOT NULL,
        source_id VARCHAR(255) NOT NULL,
        content TEXT NOT NULL,
        metadata JSONB DEFAULT '{}',
        embedding vector(1536),
        created_at TIMESTAMPTZ DEFAULT NOW(),
        updated_at TIMESTAMPTZ DEFAULT NOW(),
        UNIQUE(content_type, source_id)
    );
    CREATE INDEX IF NOT EXISTS idx_cpe_content_type ON control_plane_embeddings(content_type);

    CREATE TABLE IF NOT EXISTS mapping_rules (
        id VARCHAR(255) PRIMARY KEY,
        data JSONB NOT NULL,
        created_at TIMESTAMPTZ DEFAULT NOW(),
        updated_at TIMESTAMPTZ DEFAULT NOW()
    );
  init-age.sql: |
    CREATE EXTENSION IF NOT EXISTS age;
    LOAD 'age';
    SET search_path = ag_catalog, public;
    DO $$
    BEGIN
      IF NOT EXISTS (
        SELECT 1 FROM ag_catalog.ag_graph WHERE name = '{{ .Values.postgres.ageGraphName }}'
      ) THEN
        PERFORM ag_catalog.create_graph('{{ .Values.postgres.ageGraphName }}');
      END IF;
    END $$;
---
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-init-extensions
  namespace: {{ .Values.global.namespace }}
  labels:
    app: postgres-init
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: postgres-init
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-pg
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z pgvector-svc 5432; do sleep 3; done
      containers:
        - name: init
          image: {{ .Values.postgres.image }}
          imagePullPolicy: {{ .Values.postgres.imagePullPolicy | default "IfNotPresent" }}
          env:
            - name: PGHOST
              value: pgvector-svc
            - name: PGUSER
              value: {{ .Values.postgres.user | quote }}
            - name: PGPASSWORD
              value: {{ .Values.postgres.password | quote }}
            - name: PGDATABASE
              value: {{ .Values.postgres.database | quote }}
          command:
            - sh
            - -c
            - |
              psql -v ON_ERROR_STOP=1 -f /sql/init.sql
              AGE_COUNT=$(psql -t -A -c "SELECT count(*) FROM pg_available_extensions WHERE name = 'age';" | tr -d '[:space:]')
              if [ "${AGE_COUNT}" -gt 0 ]; then
                echo "Apache AGE available — applying init-age.sql"
                psql -v ON_ERROR_STOP=1 -f /sql/init-age.sql
              else
                echo "ERROR: Apache AGE is required but not in this Postgres image (${AGE_COUNT})" >&2
                exit 1
              fi
          volumeMounts:
            - name: sql
              mountPath: /sql
      volumes:
        - name: sql
          configMap:
            name: postgres-init-sql
{{- end }}

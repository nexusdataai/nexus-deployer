{{- if .Values.mimir.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir-config
  namespace: {{ .Values.global.namespace }}
  labels:
    app: mimir
data:
  config.yaml: |
    target: all
    multitenancy_enabled: true
    usage_stats:
      enabled: false
    server:
      http_listen_port: 8080
      grpc_listen_port: 9095
      log_level: info
    common:
      storage:
        backend: s3
        s3:
          bucket_name: {{ .Values.mimir.blocksBucket }}
          region: {{ .Values.global.awsRegion }}
          endpoint: minio-svc:9000
          access_key_id: {{ .Values.minio.accessKey }}
          secret_access_key: {{ .Values.minio.secretKey }}
          insecure: true
    blocks_storage:
      backend: s3
      storage_prefix: blocks
      s3:
        bucket_name: {{ .Values.mimir.blocksBucket }}
        region: {{ .Values.global.awsRegion }}
        endpoint: minio-svc:9000
        access_key_id: {{ .Values.minio.accessKey }}
        secret_access_key: {{ .Values.minio.secretKey }}
        insecure: true
      bucket_store:
        sync_dir: /data/tsdb-sync
      tsdb:
        dir: /data/tsdb
        retention_period: 24h
    alertmanager_storage:
      backend: s3
      storage_prefix: alertmanager
      s3:
        bucket_name: {{ .Values.mimir.blocksBucket }}
        region: {{ .Values.global.awsRegion }}
        endpoint: minio-svc:9000
        access_key_id: {{ .Values.minio.accessKey }}
        secret_access_key: {{ .Values.minio.secretKey }}
        insecure: true
    ruler_storage:
      backend: s3
      storage_prefix: ruler
      s3:
        bucket_name: {{ .Values.mimir.blocksBucket }}
        region: {{ .Values.global.awsRegion }}
        endpoint: minio-svc:9000
        access_key_id: {{ .Values.minio.accessKey }}
        secret_access_key: {{ .Values.minio.secretKey }}
        insecure: true
    ingester:
      ring:
        replication_factor: 1
        instance_addr: 127.0.0.1
        kvstore:
          store: memberlist
    distributor:
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: memberlist
    store_gateway:
      sharding_ring:
        replication_factor: 1
        kvstore:
          store: memberlist
    compactor:
      data_dir: /data/compactor
      sharding_ring:
        kvstore:
          store: memberlist
      compaction_interval: 30m
      deletion_delay: 2h
    ruler:
      rule_path: /data/ruler
      ring:
        kvstore:
          store: memberlist
    memberlist:
      bind_port: 7946
    limits:
      ingestion_rate: 10000
      ingestion_burst_size: 200000
      max_global_series_per_user: 50000
      max_global_series_per_metric: 10000
      max_label_names_per_series: 30
      max_label_value_length: 2048
      compactor_blocks_retention_period: {{ .Values.mimir.retentionDays }}d
---
apiVersion: v1
kind: Service
metadata:
  name: mimir-svc
  namespace: {{ .Values.global.namespace }}
  labels:
    app: mimir
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
    - port: 9095
      targetPort: 9095
      name: grpc
  selector:
    app: mimir
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mimir
  namespace: {{ .Values.global.namespace }}
  labels:
    app: mimir
spec:
  serviceName: mimir-svc
  replicas: 1
  selector:
    matchLabels:
      app: mimir
  template:
    metadata:
      labels:
        app: mimir
    spec:
      containers:
        - name: mimir
          image: {{ .Values.mimir.image }}
          args: ["-config.file=/etc/mimir/config.yaml"]
          env:
            - name: AWS_ACCESS_KEY_ID
              value: {{ .Values.minio.accessKey | quote }}
            - name: AWS_SECRET_ACCESS_KEY
              value: {{ .Values.minio.secretKey | quote }}
            - name: AWS_ENDPOINT_URL_S3
              value: "http://minio-svc:9000"
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9095
              name: grpc
            - containerPort: 7946
              name: memberlist
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /etc/mimir
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: mimir-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.global.storageClass }}
        resources:
          requests:
            storage: {{ .Values.mimir.persistence.size }}
{{- end }}

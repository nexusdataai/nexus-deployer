AWSTemplateFormatVersion: '2010-09-09'
Description: Backend Service Resources - ALB, ECS Service, Task Definition, Auto-scaling

Parameters:
  CapabilityName:
    Type: String
    Description: Name of the business capability
    MinLength: 1
    MaxLength: 50
    AllowedPattern: ^[a-z0-9][a-z0-9-]*$
  
  Environment:
    Type: String
    Description: Environment name
    AllowedValues:
      - dev
      - test
      - stage
      - prod
    Default: dev
  
  # Stack References
  FoundationStackName:
    Type: String
    Description: Name of the foundation stack (for log groups)
  
  IAMRolesStackName:
    Type: String
    Description: Name of the IAM roles stack
  
  DomainStackName:
    Type: String
    Description: Name of the domain stack (for certificates)
    Default: ''
  
  StorageStackName:
    Type: String
    Description: Name of the storage stack
  
  NetworkStackName:
    Type: String
    Description: Name of the network stack
  
  # Container Configuration
  ContainerImage:
    Type: String
    Description: Full ECR URI with tag (e.g., account.dkr.ecr.region.amazonaws.com/repo:tag)
    # Default to Amazon Linux minimal - a placeholder until real image is deployed
    # Note: This image won't respond to health checks, so ECS service will fail
    # A real container image must be provided for successful deployment
    Default: 'public.ecr.aws/amazonlinux/amazonlinux:2023-minimal'
  
  ContainerPort:
    Type: Number
    Description: Port number the container listens on
    Default: 8000
    MinValue: 1
    MaxValue: 65535
  
  # Task Configuration
  TaskCpu:
    Type: Number
    Description: CPU units for the task (256, 512, 1024, 2048, 4096)
    Default: 512
    AllowedValues:
      - 256
      - 512
      - 1024
      - 2048
      - 4096
  
  TaskMemory:
    Type: Number
    Description: Memory in MiB for the task
    Default: 1024
    AllowedValues:
      - 512
      - 1024
      - 2048
      - 3072
      - 4096
      - 5120
      - 6144
      - 7168
      - 8192
      - 16384
      - 30720
  
  # Service Configuration
  DesiredCount:
    Type: Number
    Description: Number of tasks to run
    Default: 2
    MinValue: 0
    MaxValue: 20
  
  MinCapacity:
    Type: Number
    Description: Minimum number of tasks for auto-scaling
    Default: 1
    MinValue: 0
    MaxValue: 20
  
  MaxCapacity:
    Type: Number
    Description: Maximum number of tasks for auto-scaling
    Default: 5
    MinValue: 1
    MaxValue: 20
  
  TargetCPUUtilization:
    Type: Number
    Description: Target CPU utilization percentage for auto-scaling
    Default: 70
    MinValue: 10
    MaxValue: 100
  
  TargetMemoryUtilization:
    Type: Number
    Description: Target memory utilization percentage for auto-scaling
    Default: 80
    MinValue: 10
    MaxValue: 100
  
  # Health Check Configuration
  HealthCheckPath:
    Type: String
    Description: Path for ALB health checks
    Default: /health
  
  HealthCheckIntervalSeconds:
    Type: Number
    Description: Health check interval in seconds
    Default: 30
    MinValue: 5
    MaxValue: 300
  
  HealthCheckTimeoutSeconds:
    Type: Number
    Description: Health check timeout in seconds
    Default: 10
    MinValue: 2
    MaxValue: 120
  
  HealthyThresholdCount:
    Type: Number
    Description: Number of consecutive successful health checks
    Default: 2
    MinValue: 2
    MaxValue: 10
  
  UnhealthyThresholdCount:
    Type: Number
    Description: Number of consecutive failed health checks
    Default: 3
    MinValue: 2
    MaxValue: 10
  
  # ALB Configuration
  EnableAccessLogs:
    Type: String
    Description: Enable ALB access logs
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'false'
  
  DeregistrationDelaySeconds:
    Type: Number
    Description: Time to wait before deregistering targets
    Default: 30
    MinValue: 0
    MaxValue: 3600
  
  # Certificate Configuration
  UseRegionalCertificate:
    Type: String
    Description: Use regional certificate stack instead of domain certificate
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'false'
  
  RegionalCertStackName:
    Type: String
    Description: Name of regional certificate stack (if UseRegionalCertificate is true)
    Default: ''
  
  UseDomainCertificate:
    Type: String
    Description: Use domain stack certificate (set to false for initial deployment to break circular dependency)
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'false'
  
  # Direct certificate ARN (for breaking circular dependency)
  CertificateArn:
    Type: String
    Description: Direct certificate ARN (used when UseDomainCertificate is false and UseRegionalCertificate is false)
    Default: ''
  
  # Route53 Configuration
  CreateRoute53Record:
    Type: String
    Description: Create Route53 DNS record (set to false - Route53 is managed by domain-stack)
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'false'
  
  # WAF Configuration
  EnableWAF:
    Type: String
    Description: Enable AWS WAF for ALB (recommended for prod)
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'false'
  
  WAFRateLimit:
    Type: Number
    Description: Rate limit for WAF (requests per 5 minutes per IP)
    Default: 2000
    MinValue: 100
    MaxValue: 20000

Conditions:
  IsProd: !Equals [!Ref Environment, 'prod']
  EnableALBLogs: !Equals [!Ref EnableAccessLogs, 'true']
  EnableWAFProtection: !Equals [!Ref EnableWAF, 'true']
  UseRegionalCert: !Equals [!Ref UseRegionalCertificate, 'true']
  UseDomainCert: !And
    - !Equals [!Ref UseDomainCertificate, 'true']
    - !Not [!Equals [!Ref DomainStackName, '']]
  UseDirectCert: !And
    - !Not [!Equals [!Ref CertificateArn, '']]
    - !Equals [!Ref UseDomainCertificate, 'false']
    - !Equals [!Ref UseRegionalCertificate, 'false']
  HasCertificate: !Or
    - !Condition UseRegionalCert
    - !Condition UseDomainCert
    - !Condition UseDirectCert
  HasDomainStack: !Not [!Equals [!Ref DomainStackName, '']]
  EnableAutoScaling: !Not [!Equals [!Ref MinCapacity, !Ref MaxCapacity]]
  ShouldCreateRoute53Record: !And
    - !Equals [!Ref CreateRoute53Record, 'true']
    - !Condition HasDomainStack

Resources:
  # ===== ALB ACCESS LOGS BUCKET =====
  
  ALBLogsBucket:
    Type: AWS::S3::Bucket
    Condition: EnableALBLogs
    DeletionPolicy: Retain
    Properties:
      BucketName: !Sub '${CapabilityName}-${Environment}-alb-logs'
      # Note: AccessControl is deprecated - using PublicAccessBlockConfiguration instead
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldLogs
            Status: Enabled
            ExpirationInDays: !If [IsProd, 90, 30]
      Tags:
        - Key: Name
          Value: !Sub '${CapabilityName}-${Environment}-alb-logs'

  ALBLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: EnableALBLogs
    Properties:
      Bucket: !Ref ALBLogsBucket
      PolicyDocument:
        Statement:
          - Sid: AllowALBAccess
            Effect: Allow
            Principal:
              AWS: !Sub 
                - 'arn:aws:iam::${ElbAccountId}:root'
                - ElbAccountId: !FindInMap [RegionELBAccountIds, !Ref AWS::Region, AccountId]
            Action:
              - s3:PutObject
            Resource: !Sub '${ALBLogsBucket.Arn}/*'

  # ===== AWS WAF =====
  
  WAFWebACL:
    Type: AWS::WAFv2::WebACL
    Condition: EnableWAFProtection
    Properties:
      Name: !Sub '${CapabilityName}-${Environment}-waf'
      Description: !Sub 'WAF for ${CapabilityName} ${Environment} ALB'
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub '${CapabilityName}-${Environment}-waf'
      Rules:
        # Rate limiting rule - prevent DDoS and abuse
        - Name: RateLimitRule
          Priority: 1
          Statement:
            RateBasedStatement:
              Limit: !Ref WAFRateLimit
              AggregateKeyType: IP
          Action:
            Block: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub '${CapabilityName}-${Environment}-rate-limit'
        # AWS Managed Rules - Common Rule Set (blocks common attacks)
        - Name: AWSManagedRulesCommonRuleSet
          Priority: 2
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub '${CapabilityName}-${Environment}-common-rules'
        # AWS Managed Rules - Known Bad Inputs
        - Name: AWSManagedRulesKnownBadInputsRuleSet
          Priority: 3
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub '${CapabilityName}-${Environment}-bad-inputs'
        # AWS Managed Rules - SQL Injection Protection
        - Name: AWSManagedRulesSQLiRuleSet
          Priority: 4
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesSQLiRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub '${CapabilityName}-${Environment}-sqli'
      Tags:
        - Key: Name
          Value: !Sub '${CapabilityName}-${Environment}-waf'
        - Key: Environment
          Value: !Ref Environment

  WAFWebACLAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Condition: EnableWAFProtection
    DependsOn: ApplicationLoadBalancer
    Properties:
      ResourceArn: !Ref ApplicationLoadBalancer
      WebACLArn: !GetAtt WAFWebACL.Arn

  # ===== APPLICATION LOAD BALANCER =====
  
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${CapabilityName}-${Environment}-alb'
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      SecurityGroups:
        - Fn::ImportValue: !Sub '${NetworkStackName}-ALBSecurityGroup'
      Subnets: !Split
        - ','
        - Fn::ImportValue: !Sub '${NetworkStackName}-PublicSubnets'
      LoadBalancerAttributes:
        - Key: deletion_protection.enabled
          Value: !If [IsProd, 'true', 'false']
        - Key: idle_timeout.timeout_seconds
          Value: '60'
        - Key: routing.http2.enabled
          Value: 'true'
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'
        - Key: routing.http.xff_client_port.enabled
          Value: 'false'
        - Key: access_logs.s3.enabled
          Value: !If [EnableALBLogs, 'true', 'false']
        - !If
          - EnableALBLogs
          - Key: access_logs.s3.bucket
            Value: !Ref ALBLogsBucket
          - !Ref AWS::NoValue
        - !If
          - EnableALBLogs
          - Key: access_logs.s3.prefix
            Value: alb
          - !Ref AWS::NoValue
      Tags:
        - Key: Name
          Value: !Sub '${CapabilityName}-${Environment}-alb'
        - Key: Environment
          Value: !Ref Environment
        - Key: Capability
          Value: !Ref CapabilityName

  # Target Group
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${CapabilityName}-${Environment}-tg'
      Port: !Ref ContainerPort
      Protocol: HTTP
      TargetType: ip
      VpcId:
        Fn::ImportValue: !Sub '${NetworkStackName}-VPCId'
      HealthCheckEnabled: true
      HealthCheckPath: !Ref HealthCheckPath
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: !Ref HealthCheckIntervalSeconds
      HealthCheckTimeoutSeconds: !Ref HealthCheckTimeoutSeconds
      HealthyThresholdCount: !Ref HealthyThresholdCount
      UnhealthyThresholdCount: !Ref UnhealthyThresholdCount
      Matcher:
        HttpCode: '200-299'
      TargetGroupAttributes:
        - Key: stickiness.enabled
          Value: 'false'
        - Key: deregistration_delay.timeout_seconds
          Value: !Ref DeregistrationDelaySeconds
        - Key: load_balancing.algorithm.type
          Value: least_outstanding_requests
      Tags:
        - Key: Name
          Value: !Sub '${CapabilityName}-${Environment}-tg'
        - Key: Environment
          Value: !Ref Environment

  # HTTPS Listener (only created when certificate is available)
  HTTPSListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !If
            - UseRegionalCert
            - Fn::ImportValue: !Sub '${RegionalCertStackName}-CertificateArn'
            - !If
              - UseDomainCert
              - Fn::ImportValue: !Sub '${DomainStackName}-BackendCertificateArn'
              - !If
                - UseDirectCert
                - !Ref CertificateArn
                - !Ref AWS::NoValue
      SslPolicy: ELBSecurityPolicy-TLS-1-2-2017-01
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # HTTP Listener (redirect to HTTPS when certificate available, forward to target when no cert)
  HTTPListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - !If
          - HasCertificate
          - Type: redirect
            RedirectConfig:
              Protocol: HTTPS
              Port: '443'
              Host: '#{host}'
              Path: '/#{path}'
              Query: '#{query}'
              StatusCode: HTTP_301
          - Type: forward
            TargetGroupArn: !Ref TargetGroup

  # ===== ECS TASK DEFINITION =====
  
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${CapabilityName}-${Environment}'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      ExecutionRoleArn:
        Fn::ImportValue: !Sub '${IAMRolesStackName}-TaskExecutionRoleArn'
      TaskRoleArn:
        Fn::ImportValue: !Sub '${IAMRolesStackName}-TaskRoleArn'
      ContainerDefinitions:
        - Name: !Sub '${CapabilityName}-container'
          Image: !Ref ContainerImage
          Essential: true
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp
          Environment:
            - Name: ENVIRONMENT
              Value: !Ref Environment
            - Name: CAPABILITY_NAME
              Value: !Ref CapabilityName
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            # S3 Buckets - using actual storage-stack export names
            - Name: S3_RECORDINGS_BUCKET
              Value:
                Fn::ImportValue: !Sub '${StorageStackName}-CallDataBucketName'
            - Name: WXCC_SIMULATOR_BUCKET
              Value:
                Fn::ImportValue: !Sub '${StorageStackName}-WxccSimulatorBucketName'
            - Name: S3_JOURNEY_LOGS_BUCKET
              Value:
                Fn::ImportValue: !Sub '${StorageStackName}-JourneyLogsBucketName'
            - Name: S3_JOURNEY_REPORTS_BUCKET
              Value:
                Fn::ImportValue: !Sub '${StorageStackName}-JourneyReportsBucketName'
            # DynamoDB Tables - using actual storage-stack export names
            - Name: DYNAMODB_TABLE
              Value:
                Fn::ImportValue: !Sub '${StorageStackName}-TransformationSystemTableName'
            - Name: LICENSE_TABLE
              Value:
                Fn::ImportValue: !Sub '${StorageStackName}-LicenseTableName'
            - Name: WXCC_TASK_TABLE
              Value:
                Fn::ImportValue: !Sub '${StorageStackName}-WxccTaskTrackingTableName'
            - Name: LEAD_TRACKING_TABLE
              Value:
                Fn::ImportValue: !Sub '${StorageStackName}-LeadOpportunityTrackingTableName'
            - Name: PORT
              Value: !Ref ContainerPort
            # WXCC Simulator Configuration (for dev/test environments)
            - Name: WXCC_SIMULATOR_ENABLED
              Value: !If [IsProd, 'false', 'true']
            - Name: WXCC_SIMULATOR_BASE_URL
              Value: !Sub 'http://localhost:${ContainerPort}/api/v1/simulator'
          # Note: OPENAI_API_KEY is loaded dynamically at runtime from Secrets Manager
          # (${CapabilityName}/${Environment}/openai) to support key rotation without container restart
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Fn::ImportValue: !Sub '${FoundationStackName}-ECSLogGroupName'
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          HealthCheck:
            Command:
              - CMD-SHELL
              - !Sub 'curl -f http://localhost:${ContainerPort}${HealthCheckPath} || exit 1'
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60
      Tags:
        - Key: Name
          Value: !Sub '${CapabilityName}-${Environment}-task'
        - Key: Environment
          Value: !Ref Environment
        - Key: Capability
          Value: !Ref CapabilityName

  # ===== ECS SERVICE =====
  
  ECSService:
    Type: AWS::ECS::Service
    DependsOn:
      - HTTPListener
    Properties:
      ServiceName: !Sub '${CapabilityName}-${Environment}-service'
      Cluster:
        Fn::ImportValue: !Sub '${NetworkStackName}-ClusterName'
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      PlatformVersion: LATEST
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Split
            - ','
            - Fn::ImportValue: !Sub '${NetworkStackName}-PrivateSubnets'
          SecurityGroups:
            - Fn::ImportValue: !Sub '${NetworkStackName}-ECSSecurityGroup'
          AssignPublicIp: DISABLED
      LoadBalancers:
        - ContainerName: !Sub '${CapabilityName}-container'
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref TargetGroup
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: !If [IsProd, 100, 50]
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      EnableECSManagedTags: true
      PropagateTags: TASK_DEFINITION
      Tags:
        - Key: Name
          Value: !Sub '${CapabilityName}-${Environment}-service'
        - Key: Environment
          Value: !Ref Environment
        - Key: Capability
          Value: !Ref CapabilityName

  # ===== AUTO SCALING =====
  
  ServiceScalingTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Condition: EnableAutoScaling
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub 
        - 'service/${ClusterName}/${ServiceName}'
        - ClusterName:
            Fn::ImportValue: !Sub '${NetworkStackName}-ClusterName'
          ServiceName: !GetAtt ECSService.Name
      MinCapacity: !Ref MinCapacity
      MaxCapacity: !Ref MaxCapacity
      RoleARN:
        Fn::ImportValue: !Sub '${IAMRolesStackName}-AutoScalingRoleArn'

  ServiceScalingPolicyCPU:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Condition: EnableAutoScaling
    Properties:
      PolicyName: !Sub '${CapabilityName}-${Environment}-cpu-scaling'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ServiceScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: !Ref TargetCPUUtilization
        ScaleInCooldown: 300
        ScaleOutCooldown: 120

  ServiceScalingPolicyMemory:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Condition: EnableAutoScaling
    Properties:
      PolicyName: !Sub '${CapabilityName}-${Environment}-memory-scaling'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ServiceScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageMemoryUtilization
        TargetValue: !Ref TargetMemoryUtilization
        ScaleInCooldown: 300
        ScaleOutCooldown: 120

  # ===== ROUTE53 ALIAS UPDATE =====
  # Note: Route53 records are now managed in the domain-stack.yaml
  # This section is kept for backward compatibility but should be disabled
  # by setting CreateRoute53Record to 'false' when using domain-stack
  
  Route53RecordSet:
    Type: AWS::Route53::RecordSet
    Condition: ShouldCreateRoute53Record
    Properties:
      HostedZoneId:
        Fn::ImportValue: !Sub '${DomainStackName}-HostedZoneId'
      Name:
        Fn::ImportValue: !Sub '${DomainStackName}-ApiDomainName'
      Type: A
      AliasTarget:
        HostedZoneId: !GetAtt ApplicationLoadBalancer.CanonicalHostedZoneID
        DNSName: !GetAtt ApplicationLoadBalancer.DNSName
        EvaluateTargetHealth: true

# Regional ELB Account IDs for ALB logs
Mappings:
  RegionELBAccountIds:
    us-east-1:
      AccountId: '127311923021'
    us-east-2:
      AccountId: '033677994240'
    us-west-1:
      AccountId: '027434742980'
    us-west-2:
      AccountId: '797873946194'
    eu-west-1:
      AccountId: '156460612806'
    eu-west-2:
      AccountId: '652711504416'
    eu-west-3:
      AccountId: '009996457667'
    eu-central-1:
      AccountId: '054676820928'
    ap-northeast-1:
      AccountId: '582318560864'
    ap-northeast-2:
      AccountId: '600734575887'
    ap-southeast-1:
      AccountId: '114774131450'
    ap-southeast-2:
      AccountId: '783225319266'
    ap-south-1:
      AccountId: '718504428378'
    ca-central-1:
      AccountId: '985666609251'

Outputs:
  LoadBalancerArn:
    Description: ARN of the Application Load Balancer
    Value: !Ref ApplicationLoadBalancer
    Export:
      Name: !Sub '${AWS::StackName}-LoadBalancerArn'
  
  LoadBalancerDNS:
    Description: DNS name of the Application Load Balancer
    Value: !GetAtt ApplicationLoadBalancer.DNSName
    Export:
      Name: !Sub '${AWS::StackName}-LoadBalancerDNS'
  
  LoadBalancerZone:
    Description: Hosted Zone ID of the Application Load Balancer
    Value: !GetAtt ApplicationLoadBalancer.CanonicalHostedZoneID
    Export:
      Name: !Sub '${AWS::StackName}-LoadBalancerZone'
  
  ServiceURL:
    Description: URL of the service
    Value: !Sub 'https://${ApplicationLoadBalancer.DNSName}'
    Export:
      Name: !Sub '${AWS::StackName}-ServiceURL'
  
  ApiURL:
    Description: API URL with custom domain
    Condition: HasDomainStack
    Value: !Sub 
      - 'https://${Domain}'
      - Domain:
          Fn::ImportValue: !Sub '${DomainStackName}-ApiDomainName'
    Export:
      Name: !Sub '${AWS::StackName}-ApiURL'
  
  ServiceArn:
    Description: ARN of the ECS Service
    Value: !Ref ECSService
    Export:
      Name: !Sub '${AWS::StackName}-ServiceArn'
  
  ServiceName:
    Description: Name of the ECS Service
    Value: !GetAtt ECSService.Name
    Export:
      Name: !Sub '${AWS::StackName}-ServiceName'
  
  TargetGroupArn:
    Description: ARN of the Target Group
    Value: !Ref TargetGroup
    Export:
      Name: !Sub '${AWS::StackName}-TargetGroupArn'
  
  TaskDefinitionArn:
    Description: ARN of the Task Definition
    Value: !Ref TaskDefinition
    Export:
      Name: !Sub '${AWS::StackName}-TaskDefinitionArn'
  
  WAFWebACLArn:
    Description: ARN of the WAF Web ACL
    Condition: EnableWAFProtection
    Value: !GetAtt WAFWebACL.Arn
    Export:
      Name: !Sub '${AWS::StackName}-WAFWebACLArn'
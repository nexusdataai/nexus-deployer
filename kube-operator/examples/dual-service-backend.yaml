---
# Dual Backend Services Pattern
# 
# Creates TWO services for the same backend pods:
# 1. ClusterIP (internal) - For frontend UI to use (fast, private)
# 2. LoadBalancer (external) - For external applications (public API)
#
# Apply AFTER deploying TotogiCapability
#
# Usage:
#   kubectl apply -f dual-service-backend.yaml

apiVersion: v1
kind: Service
metadata:
  name: call-processing-prod-backend-svc-internal
  namespace: call-processing-prod
  labels:
    app.kubernetes.io/name: call-processing
    app.kubernetes.io/component: backend
    totogi.com/service-type: internal
spec:
  type: ClusterIP  # Internal only - not exposed outside cluster
  selector:
    app: call-processing-prod-backend  # Must match deployment pods
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: call-processing-prod-backend-svc-external
  namespace: call-processing-prod
  labels:
    app.kubernetes.io/name: call-processing
    app.kubernetes.io/component: backend
    totogi.com/service-type: external
  annotations:
    # AWS LoadBalancer configuration
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"  # Network Load Balancer (faster, cheaper)
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    
    # Optional: Restrict access to specific IPs
    # service.beta.kubernetes.io/aws-load-balancer-source-ranges: "203.0.113.0/24,198.51.100.0/24"
    
    # Optional: Enable cross-zone load balancing
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer  # External - creates AWS Load Balancer
  selector:
    app: call-processing-prod-backend  # Same pods as internal service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP

---
# Notes:
# 
# 1. Both services point to the SAME backend pods
# 2. Internal service (ClusterIP):
#    - Fast: No internet round-trip
#    - Secure: Not exposed externally
#    - Free: No data transfer costs
#    - DNS: call-processing-prod-backend-svc-internal:8000
# 
# 3. External service (LoadBalancer):
#    - Public: Accessible from internet
#    - Secure: Use API keys, rate limiting, WAF
#    - Cost: LoadBalancer + data transfer charges
#    - URL: Will get AWS ELB hostname
#
# 4. Frontend nginx.conf should proxy to internal service:
#    location /api/ {
#        proxy_pass http://call-processing-prod-backend-svc-internal:8000;
#    }
#
# 5. External apps use LoadBalancer URL:
#    http://abc123-xyz.elb.amazonaws.com:8000/api/v1/endpoint
#
# 6. Security recommendations for external service:
#    - Add authentication (API keys, JWT)
#    - Enable rate limiting
#    - Use AWS WAF for protection
#    - Monitor with CloudWatch
#    - Set up alerts for anomalies

# Nexus AI Engine capability (operator pipeline target)
#
# First-time deploy:
#   ./operator.sh deploy
#   ./deploy-capability.sh --product ai-engine --env dev
#
# Dev iteration:     ./deploy-app-changes.sh ai-engine --env dev
#
# Full pipeline (jumpbox / release):
#   bump-version.sh ai-engine-all patch
#   package-images.sh --only-ai-engine-images
#   create-ecr-images.sh --only-ai-engine-images
#   app-rollout.sh --capability ai-engine --env dev --version <tag> ai-engine-all
#
# Images:
#   __ECR_REGISTRY__/nexus-ai-engine-api:<tag>
#   __ECR_REGISTRY__/nexus-ai-engine-ui:<tag>
#
# Namespaces:
#   dev      -> ai-engine-dev
#   staging  -> ai-engine-staging
#   prod     -> ai-engine

apiVersion: nexus.ai/v1
kind: NexusCapability
metadata:
  name: ai-engine-__ENV__
  namespace: ai-engine-__ENV__
  labels:
    app.kubernetes.io/name: nexus-ai-engine
    nexus.ai/capability: ai-engine
    nexus.ai/environment: __ENV__
spec:
  capabilityName: ai-engine
  version: "0.2.0"
  environment: __ENV__
  region: us-east-1
  enableCognito: false
  deletionPolicy: Retain

  dataServices:
    dynamodb:
      enabled: true
    s3:
      enabled: true
    glue:
      enabled: false

  backend:
    enabled: true
    replicas: 1
    image: "__ECR_REGISTRY__/nexus-ai-engine-api:latest"

  frontend:
    enabled: true
    replicas: 1
    image: "__ECR_REGISTRY__/nexus-ai-engine-ui:latest"

  bssmagic:
    enabled: false

  postgres:
    enabled: false

  mimir:
    enabled: false

  redis:
    enabled: true

  jobWorker:
    enabled: true
    replicas: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 10
      lagThreshold: 5

  ingress:
    enabled: true
    scheme: internet-facing
    healthCheckPath: /health

  internalIngress:
    enabled: false

  hpa:
    enabled: false

  pdb:
    enabled: false

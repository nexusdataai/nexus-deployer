AWSTemplateFormatVersion: '2010-09-09'
Description: Backend Network Resources - VPC, Subnets, Security Groups, ECS Cluster

Parameters:
  CapabilityName:
    Type: String
    Description: Name of the business capability
    MinLength: 1
    MaxLength: 50
    AllowedPattern: ^[a-z0-9][a-z0-9-]*$
  
  Environment:
    Type: String
    Description: Environment name
    AllowedValues:
      - dev
      - test
      - stage
      - prod
    Default: dev
  
  # VPC Configuration
  UseExistingVPC:
    Type: String
    Description: Use an existing VPC instead of creating a new one
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'false'
  
  ExistingVPCId:
    Type: String
    Description: ID of existing VPC (required if UseExistingVPC is true)
    Default: ''
  
  ExistingPublicSubnet1:
    Type: String
    Description: ID of existing public subnet 1 (required if UseExistingVPC is true)
    Default: ''
  
  ExistingPublicSubnet2:
    Type: String
    Description: ID of existing public subnet 2 (required if UseExistingVPC is true)
    Default: ''
  
  ExistingPrivateSubnet1:
    Type: String
    Description: ID of existing private subnet 1 (required if UseExistingVPC is true)
    Default: ''
  
  ExistingPrivateSubnet2:
    Type: String
    Description: ID of existing private subnet 2 (required if UseExistingVPC is true)
    Default: ''
  
  VPCCidr:
    Type: String
    Description: CIDR block for new VPC (only used if creating new VPC)
    Default: 10.0.0.0/16
    AllowedPattern: ^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/([0-9]|[1-2][0-9]|3[0-2]))$
  
  PublicSubnet1Cidr:
    Type: String
    Description: CIDR block for public subnet 1 (only used if creating new VPC)
    Default: 10.0.1.0/24
    AllowedPattern: ^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/([0-9]|[1-2][0-9]|3[0-2]))$
  
  PublicSubnet2Cidr:
    Type: String
    Description: CIDR block for public subnet 2 (only used if creating new VPC)
    Default: 10.0.2.0/24
    AllowedPattern: ^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/([0-9]|[1-2][0-9]|3[0-2]))$
  
  PrivateSubnet1Cidr:
    Type: String
    Description: CIDR block for private subnet 1 (only used if creating new VPC)
    Default: 10.0.10.0/24
    AllowedPattern: ^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/([0-9]|[1-2][0-9]|3[0-2]))$
  
  PrivateSubnet2Cidr:
    Type: String
    Description: CIDR block for private subnet 2 (only used if creating new VPC)
    Default: 10.0.11.0/24
    AllowedPattern: ^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/([0-9]|[1-2][0-9]|3[0-2]))$
  
  EnableNATGateway:
    Type: String
    Description: Enable NAT Gateway for private subnets (costs apply)
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'true'
  
  EnableFlowLogs:
    Type: String
    Description: Enable VPC Flow Logs
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'false'
  
  EnableContainerInsights:
    Type: String
    Description: Enable Container Insights for ECS Cluster
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'true'
  
  ContainerPort:
    Type: Number
    Description: Port number the application container listens on
    Default: 8000
    MinValue: 1
    MaxValue: 65535

Conditions:
  CreateNewVPC: !Equals [!Ref UseExistingVPC, 'false']
  UseExistingVPCResources: !Equals [!Ref UseExistingVPC, 'true']
  CreateNATGateway: !And
    - !Condition CreateNewVPC
    - !Equals [!Ref EnableNATGateway, 'true']
  CreateFlowLogs: !And
    - !Condition CreateNewVPC
    - !Equals [!Ref EnableFlowLogs, 'true']
  EnableInsights: !Equals [!Ref EnableContainerInsights, 'true']
  IsProd: !Equals [!Ref Environment, 'prod']

Resources:
  # ===== VPC AND NETWORKING =====
  
  # VPC
  VPC:
    Type: AWS::EC2::VPC
    Condition: CreateNewVPC
    Properties:
      CidrBlock: !Ref VPCCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub '${CapabilityName}-${Environment}-vpc'
        - Key: Environment
          Value: !Ref Environment
        - Key: Capability
          Value: !Ref CapabilityName

  # Internet Gateway
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Condition: CreateNewVPC
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${CapabilityName}-${Environment}-igw'
        - Key: Environment
          Value: !Ref Environment

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: CreateNewVPC
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # Public Subnet 1
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Condition: CreateNewVPC
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${CapabilityName}-${Environment}-public-subnet-1'
        - Key: Type
          Value: Public
        - Key: Environment
          Value: !Ref Environment

  # Public Subnet 2
  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Condition: CreateNewVPC
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${CapabilityName}-${Environment}-public-subnet-2'
        - Key: Type
          Value: Public
        - Key: Environment
          Value: !Ref Environment

  # Private Subnet 1
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Condition: CreateNewVPC
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${CapabilityName}-${Environment}-private-subnet-1'
        - Key: Type
          Value: Private
        - Key: Environment
          Value: !Ref Environment

  # Private Subnet 2
  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Condition: CreateNewVPC
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${CapabilityName}-${Environment}-private-subnet-2'
        - Key: Type
          Value: Private
        - Key: Environment
          Value: !Ref Environment

  # Elastic IP for NAT Gateway
  NATGatewayEIP:
    Type: AWS::EC2::EIP
    Condition: CreateNATGateway
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${CapabilityName}-${Environment}-nat-eip'
        - Key: Environment
          Value: !Ref Environment

  # NAT Gateway
  NATGateway:
    Type: AWS::EC2::NatGateway
    Condition: CreateNATGateway
    Properties:
      AllocationId: !GetAtt NATGatewayEIP.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub '${CapabilityName}-${Environment}-nat'
        - Key: Environment
          Value: !Ref Environment

  # Route Table for Public Subnets
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: CreateNewVPC
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${CapabilityName}-${Environment}-public-rt'
        - Key: Type
          Value: Public
        - Key: Environment
          Value: !Ref Environment

  PublicRoute:
    Type: AWS::EC2::Route
    Condition: CreateNewVPC
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateNewVPC
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateNewVPC
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # Route Table for Private Subnets
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: CreateNewVPC
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${CapabilityName}-${Environment}-private-rt'
        - Key: Type
          Value: Private
        - Key: Environment
          Value: !Ref Environment

  PrivateRoute:
    Type: AWS::EC2::Route
    Condition: CreateNATGateway
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NATGateway

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateNewVPC
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateNewVPC
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # VPC Flow Logs
  VPCFlowLogRole:
    Type: AWS::IAM::Role
    Condition: CreateFlowLogs
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: vpc-flow-logs.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudWatchLogPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                Resource: '*'

  VPCFlowLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: CreateFlowLogs
    Properties:
      LogGroupName: !Sub '/aws/vpc/${CapabilityName}-${Environment}'
      RetentionInDays: !If [IsProd, 30, 7]

  VPCFlowLog:
    Type: AWS::EC2::FlowLog
    Condition: CreateFlowLogs
    Properties:
      ResourceType: VPC
      ResourceId: !Ref VPC
      TrafficType: ALL
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref VPCFlowLogGroup
      DeliverLogsPermissionArn: !GetAtt VPCFlowLogRole.Arn
      Tags:
        - Key: Name
          Value: !Sub '${CapabilityName}-${Environment}-flow-logs'
        - Key: Environment
          Value: !Ref Environment

  # ===== SECURITY GROUPS =====
  
  # Security Group for ALB
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Application Load Balancer
      VpcId: !If [CreateNewVPC, !Ref VPC, !Ref ExistingVPCId]
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS from anywhere
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP from anywhere (redirect to HTTPS)
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic
      Tags:
        - Key: Name
          Value: !Sub '${CapabilityName}-${Environment}-alb-sg'
        - Key: Environment
          Value: !Ref Environment
        - Key: Capability
          Value: !Ref CapabilityName

  # Security Group for ECS Tasks
  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for ECS tasks
      VpcId: !If [CreateNewVPC, !Ref VPC, !Ref ExistingVPCId]
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref ContainerPort
          ToPort: !Ref ContainerPort
          SourceSecurityGroupId: !Ref ALBSecurityGroup
          Description: Application port from ALB
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref ALBSecurityGroup
          Description: Alternative app port from ALB
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic
      Tags:
        - Key: Name
          Value: !Sub '${CapabilityName}-${Environment}-ecs-sg'
        - Key: Environment
          Value: !Ref Environment
        - Key: Capability
          Value: !Ref CapabilityName

  # Allow ECS tasks to communicate with each other
  ECSSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ECSSecurityGroup
      IpProtocol: -1
      SourceSecurityGroupId: !Ref ECSSecurityGroup
      Description: Allow ECS tasks to communicate

  # ===== VPC ENDPOINTS =====
  # VPC Endpoints allow private subnet resources to access AWS services without NAT Gateway
  
  # DynamoDB VPC Endpoint (Gateway type - free)
  DynamoDBVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateNewVPC
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.dynamodb'
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable
        - !Ref PublicRouteTable
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
              - dynamodb:Scan
              - dynamodb:BatchGetItem
              - dynamodb:BatchWriteItem
              - dynamodb:DescribeTable
              - dynamodb:DescribeStream
              - dynamodb:GetRecords
              - dynamodb:GetShardIterator
              - dynamodb:ListStreams
              - dynamodb:ConditionCheckItem
              - dynamodb:TransactGetItems
              - dynamodb:TransactWriteItems
              - dynamodb:ListTables
              - dynamodb:DescribeLimits
              - dynamodb:DescribeTimeToLive
              - dynamodb:PartiQLSelect
              - dynamodb:PartiQLInsert
              - dynamodb:PartiQLUpdate
              - dynamodb:PartiQLDelete
            Resource: '*'

  # S3 VPC Endpoint (Gateway type - free)
  S3VPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateNewVPC
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable
        - !Ref PublicRouteTable
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
              - s3:ListBucket
              - s3:GetBucketLocation
              - s3:GetObjectVersion
              - s3:GetBucketVersioning
            Resource: '*'

  # ===== ECS CLUSTER =====
  
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${CapabilityName}-${Environment}-cluster'
      ClusterSettings:
        - Name: containerInsights
          Value: !If [EnableInsights, 'enabled', 'disabled']
      CapacityProviders:
        - FARGATE
        - FARGATE_SPOT
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: !If [IsProd, 2, 1]
          Base: 1
        - CapacityProvider: FARGATE_SPOT
          Weight: !If [IsProd, 1, 2]
      Tags:
        - Key: Name
          Value: !Sub '${CapabilityName}-${Environment}-cluster'
        - Key: Environment
          Value: !Ref Environment
        - Key: Capability
          Value: !Ref CapabilityName

Outputs:
  VPCId:
    Description: VPC ID
    Value: !If [CreateNewVPC, !Ref VPC, !Ref ExistingVPCId]
    Export:
      Name: !Sub '${AWS::StackName}-VPCId'
  
  VPCCidr:
    Description: VPC CIDR block
    Value: !If [CreateNewVPC, !Ref VPCCidr, 'N/A']
    Export:
      Name: !Sub '${AWS::StackName}-VPCCidr'
  
  PublicSubnet1:
    Description: Public Subnet 1 ID
    Value: !If [CreateNewVPC, !Ref PublicSubnet1, !Ref ExistingPublicSubnet1]
    Export:
      Name: !Sub '${AWS::StackName}-PublicSubnet1'
  
  PublicSubnet2:
    Description: Public Subnet 2 ID
    Value: !If [CreateNewVPC, !Ref PublicSubnet2, !Ref ExistingPublicSubnet2]
    Export:
      Name: !Sub '${AWS::StackName}-PublicSubnet2'
  
  PublicSubnets:
    Description: Comma-delimited list of public subnet IDs
    Value: !If
      - CreateNewVPC
      - !Join [',', [!Ref PublicSubnet1, !Ref PublicSubnet2]]
      - !Join [',', [!Ref ExistingPublicSubnet1, !Ref ExistingPublicSubnet2]]
    Export:
      Name: !Sub '${AWS::StackName}-PublicSubnets'
  
  PrivateSubnet1:
    Description: Private Subnet 1 ID
    Value: !If [CreateNewVPC, !Ref PrivateSubnet1, !Ref ExistingPrivateSubnet1]
    Export:
      Name: !Sub '${AWS::StackName}-PrivateSubnet1'
  
  PrivateSubnet2:
    Description: Private Subnet 2 ID
    Value: !If [CreateNewVPC, !Ref PrivateSubnet2, !Ref ExistingPrivateSubnet2]
    Export:
      Name: !Sub '${AWS::StackName}-PrivateSubnet2'
  
  PrivateSubnets:
    Description: Comma-delimited list of private subnet IDs
    Value: !If
      - CreateNewVPC
      - !Join [',', [!Ref PrivateSubnet1, !Ref PrivateSubnet2]]
      - !Join [',', [!Ref ExistingPrivateSubnet1, !Ref ExistingPrivateSubnet2]]
    Export:
      Name: !Sub '${AWS::StackName}-PrivateSubnets'
  
  ALBSecurityGroupId:
    Description: ALB Security Group ID
    Value: !Ref ALBSecurityGroup
    Export:
      Name: !Sub '${AWS::StackName}-ALBSecurityGroup'
  
  ECSSecurityGroupId:
    Description: ECS Security Group ID
    Value: !Ref ECSSecurityGroup
    Export:
      Name: !Sub '${AWS::StackName}-ECSSecurityGroup'
  
  ClusterName:
    Description: ECS Cluster Name
    Value: !Ref ECSCluster
    Export:
      Name: !Sub '${AWS::StackName}-ClusterName'
  
  ClusterArn:
    Description: ECS Cluster ARN
    Value: !GetAtt ECSCluster.Arn
    Export:
      Name: !Sub '${AWS::StackName}-ClusterArn'
  
  NATGatewayIP:
    Description: NAT Gateway Elastic IP
    Condition: CreateNATGateway
    Value: !Ref NATGatewayEIP
    Export:
      Name: !Sub '${AWS::StackName}-NATGatewayIP'
  
  DynamoDBVPCEndpointId:
    Description: DynamoDB VPC Endpoint ID
    Condition: CreateNewVPC
    Value: !Ref DynamoDBVPCEndpoint
    Export:
      Name: !Sub '${AWS::StackName}-DynamoDBVPCEndpoint'
  
  S3VPCEndpointId:
    Description: S3 VPC Endpoint ID
    Condition: CreateNewVPC
    Value: !Ref S3VPCEndpoint
    Export:
      Name: !Sub '${AWS::StackName}-S3VPCEndpoint'

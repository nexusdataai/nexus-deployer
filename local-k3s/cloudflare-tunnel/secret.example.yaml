# Do not apply this file with a real token. Create the secret via CLI:
#
#   kubectl --context local-cluster create secret generic cloudflared-token \
#     -n cloudflare \
#     --from-literal=TUNNEL_TOKEN='<token-from-cloudflare-zero-trust>'
#
# Rotate the token in Cloudflare if it was ever exposed in chat or logs.

apiVersion: v1
kind: Secret
metadata:
  name: cloudflared-token
  namespace: cloudflare
type: Opaque
stringData:
  TUNNEL_TOKEN: REPLACE_ME

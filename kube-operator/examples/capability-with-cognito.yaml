---
# NexusCapability with Automatic Cognito Provisioning
#
# This example shows how to deploy an application with automatic
# Cognito User Pool creation and SSM configuration.
#
# Deploy:
#   kubectl create namespace myapp-dev
#   kubectl apply -f capability-with-cognito.yaml
#
# The operator will:
# 1. Create Cognito User Pool
# 2. Create App Client with OAuth
# 3. Create Cognito Domain
# 4. Store config in SSM Parameter Store
# 5. Deploy backend (reads from SSM)
# 6. Deploy frontend

apiVersion: nexus.ai/v1
kind: NexusCapability
metadata:
  name: myapp-dev
  namespace: myapp-dev
  labels:
    app.kubernetes.io/name: myapp
    nexus.ai/environment: dev
spec:
  # Capability identification
  capabilityName: myapp
  version: "1.0.0"
  environment: dev
  region: ap-southeast-1
  
  # Enable automatic Cognito provisioning
  enableCognito: true
  
  # Frontend URL (for OAuth callback configuration)
  frontendUrl: "https://myapp-dev.example.com"
  
  # Additional callback URLs (optional)
  cognitoCallbackUrls:
    - "https://myapp-dev.example.com/auth/callback"
    - "https://myapp-staging.example.com/auth/callback"
    - "http://localhost:5173/auth/callback"  # For local development
  
  # Frontend - Must listen on port 8080
  frontend:
    replicas: 2
    image: "ACCOUNT.dkr.ecr.REGION.amazonaws.com/myapp-frontend:1.0.0"
  
  # Backend - Must listen on port 8000 with /health endpoint
  # Backend will automatically read Cognito config from SSM
  backend:
    replicas: 2
    image: "ACCOUNT.dkr.ecr.REGION.amazonaws.com/myapp-backend:1.0.0"
  
  # AWS data services
  dataServices:
    dynamodb: {}
    s3: {}
    glue: {}
  
  # Cleanup policy
  deletionPolicy: Delete  # Deletes Cognito when capability is deleted

---
# What Gets Created:
#
# Cognito Resources:
#   - User Pool: myapp-dev
#   - Groups: Admin, Executive, SalesManager, Rep
#   - App Client: myapp-client-dev (OAuth enabled)
#   - Domain: myapp-dev-{account-id}
#
# SSM Parameters:
#   - /myapp/dev/cognito/region
#   - /myapp/dev/cognito/user-pool-id
#   - /myapp/dev/cognito/client-id
#   - /myapp/dev/cognito/domain
#   - /myapp/dev/cognito/redirect-uri
#
# Kubernetes Resources:
#   - Namespace: myapp-dev
#   - Frontend: 2 pods on port 8080
#   - Backend: 2 pods on port 8000
#   - Services: LoadBalancer for both
#
# Verification:
#   kubectl get tc myapp-dev -n myapp-dev
#   aws cognito-idp list-user-pools --max-results 10
#   aws ssm get-parameters-by-path --path "/myapp/dev/cognito/"
#   kubectl logs -n myapp-dev deployment/myapp-dev-backend | grep Cognito
